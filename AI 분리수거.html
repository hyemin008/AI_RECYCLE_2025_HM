<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI 분리수거 도우미 (Teachable Machine)</title>

  <!-- 테마 -->
  <style>
    :root{
      --beige:#f8f5e7;
      --green:#b8d8ba;
      --green-dark:#2e3d30;
      --panel:#ffffff;
    }
    *{box-sizing:border-box}
    body{
      margin:0; font-family:"Noto Sans KR", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:var(--beige); color:var(--green-dark);
      display:flex; min-height:100vh; flex-direction:column;
    }
    header{
      background:var(--green); padding:18px 12px; text-align:center;
      box-shadow:0 2px 6px rgba(0,0,0,.06);
    }
    header h1{margin:0; font-size:1.4rem}
    main{
      width:min(980px,92%); margin:28px auto; background:var(--panel);
      border-radius:18px; padding:22px; box-shadow:0 8px 24px rgba(0,0,0,.06);
    }
    .uploader{
      border:2px dashed #cfe3cf; border-radius:14px; padding:18px; text-align:center;
      background:#fbfdfa;
    }
    .uploader input{display:none}
    .uploader label{
      display:inline-block; padding:10px 16px; background:var(--green);
      color:var(--green-dark); border-radius:10px; cursor:pointer; font-weight:700;
    }
    .preview-wrap{
      margin-top:16px; display:grid; grid-template-columns:1fr; gap:14px;
    }
    .preview{
      width:100%; max-height:380px; object-fit:contain; border-radius:12px; display:none;
      background:#f4f7f1;
    }
    .result{
      margin-top:8px; padding:14px; border-radius:12px; background:#f3f9f3; display:none;
    }
    .result h3{margin:0 0 6px 0; font-size:1.05rem}
    .pill{
      display:inline-block; padding:6px 10px; border-radius:999px; background:#e6f3e6; margin:4px 6px 0 0; font-size:.9rem;
    }
    .guide{
      margin-top:10px; padding:12px; background:#fff; border:1px solid #e8f0e8; border-radius:10px; line-height:1.55;
    }
    .row{display:grid; grid-template-columns:1fr 1fr; gap:18px}
    @media (max-width:720px){ .row{grid-template-columns:1fr} }
    .spinner{
      display:none; margin-top:12px; font-size:.95rem;
    }
    footer{margin:20px 0 28px; text-align:center; color:#6b7a6f; font-size:.9rem}
  </style>

  <!-- TFJS & Teachable Machine Image 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.16.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
</head>
<body>
  <header><h1>♻️ AI 분리수거 도우미</h1></header>

  <main>
    <div class="row">
      <section>
        <h2 style="margin:0 0 10px 0; font-size:1.15rem;">1) 쓰레기 사진 업로드</h2>
        <div class="uploader">
          <input id="fileInput" type="file" accept="image/*" />
          <label for="fileInput">이미지 선택 / 촬영</label>
          <div class="spinner" id="loadingMsg">모델 준비 중…</div>
        </div>
        <div class="preview-wrap">
          <img id="preview" class="preview" alt="미리보기" />
        </div>
      </section>

      <section>
        <h2 style="margin:0 0 10px 0; font-size:1.15rem;">2) 인식 결과</h2>
        <div id="result" class="result">
          <h3 id="topLabel">—</h3>
          <div id="topProbs" style="margin-bottom:10px;"></div>
          <div id="guide" class="guide"></div>
        </div>
      </section>
    </div>
  </main>

  <footer>© 2025 GreenAI | Teachable Machine + TensorFlow.js</footer>

  <script>
    // ⬇⬇ 여기만 수정하세요 ⬇⬇
    // 링크 모델 사용: "https://teachablemachine.withgoogle.com/models/XXXX/"
    // 로컬 모델 사용: "./model/"  (model.json, metadata.json이 그 폴더에 있어야 함)
    const TM_URL = "https://teachablemachine.withgoogle.com/models/ZDrUQugEV/"; // ← 본인 모델로 교체
    // ⬆⬆ 여기만 수정하세요 ⬆⬆

    const fileInput = document.getElementById('fileInput');
    const preview   = document.getElementById('preview');
    const resultBox = document.getElementById('result');
    const topLabel  = document.getElementById('topLabel');
    const probsBox  = document.getElementById('topProbs');
    const guideBox  = document.getElementById('guide');
    const loadingMsg= document.getElementById('loadingMsg');

    // 분리배출 안내 DB (필요에 맞게 자유롭게 수정/추가)
    const GUIDE_DB = {
      "plastic": "플라스틱은 내용물을 비우고 깨끗이 헹군 뒤 가능한 한 압착해 배출하세요. 라벨/뚜껑은 분리.",
      "paper": "종이는 테이프·스테이플·비닐 코팅을 제거하고, 젖은 종이는 일반쓰레기로. 상자는 접어서 배출.",
      "cardboard": "골판지는 테이프·철핀 제거 후 납작하게 접어 배출. 기름/오염은 일반쓰레기.",
      "glass": "유리는 내용물 비우고 헹군 뒤 배출. 뚜껑/금속링은 분리, 깨진 유리는 신문지로 감싸 표기 후 배출.",
      "metal": "캔/철류는 헹군 뒤 압착, 라벨 분리. 이물질/페인트 잔존 시 일반폐기물 규정 확인.",
      "trash": "재활용 불가 오염물/복합재질은 일반쓰레기로. 가능하면 분해·분리 후 배출.",
      "food": "물기 빼고 이물질(비닐/포크 등) 제거 후 음식물 전용 봉투로 배출.",
      // 한국어 클래스명이면 그대로 추가
      "플라스틱": "내용물 비우고 헹군 뒤 압착. 라벨/뚜껑 분리.",
      "종이": "테이프·스테이플 제거, 접어서 배출. 젖은 종이는 일반쓰레기.",
      "유리": "헹군 뒤 색상별 분리. 뚜껑 분리.",
      "캔": "헹군 뒤 압착. 라벨 분리.",
      "비닐": "내용물 제거·세척 후 건조하여 배출. 오염 심하면 일반쓰레기."
    };

    let model, maxPredictions = 0;

    async function loadModel(){
      try{
        loadingMsg.style.display = 'block';
        const modelURL    = TM_URL.endsWith('/') ? TM_URL + 'model.json'    : TM_URL + '/model.json';
        const metadataURL = TM_URL.endsWith('/') ? TM_URL + 'metadata.json' : TM_URL + '/metadata.json';
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();
      }catch(err){
        alert('모델을 불러오지 못했습니다. TM_URL을 확인하세요.\n' + err);
      }finally{
        loadingMsg.style.display = 'none';
      }
    }

    // 파일 선택 시: 미리보기 → 예측 수행
    fileInput.addEventListener('change', async (e)=>{
      const file = e.target.files?.[0];
      if(!file) return;

      // 미리보기
      const url = URL.createObjectURL(file);
      preview.src = url;
      preview.style.display = 'block';

      // 모델 준비
      if(!model) await loadModel();

      // 예측
      await predict(preview);

      // 메모리 정리
      URL.revokeObjectURL(url);
    });

    function toPercent(p){ return (p*100).toFixed(1) + '%'; }

    async function predict(imgEl){
      if(!model) return;
      resultBox.style.display = 'none';
      probsBox.innerHTML = '';
      topLabel.textContent = '예측 중…';
      guideBox.textContent = '';
      resultBox.style.display = 'block';

      // 누수 방지
      tf.engine().startScope();
      try{
        const predictions = await model.predict(imgEl, false);
        // 확률순 정렬
        predictions.sort((a,b)=> b.probability - a.probability);

        // 상위 3개 표시
        const top3 = predictions.slice(0, Math.min(3, predictions.length));
        topLabel.textContent = `예측 결과: ${top3[0].className} (${toPercent(top3[0].probability)})`;
        probsBox.innerHTML = top3.map(p => 
          `<span class="pill">${p.className}: ${toPercent(p.probability)}</span>`
        ).join('');

        // 안내문 매핑 (영문/한글 키 모두 시도)
        const keyCandidates = [
          top3[0].className,
          top3[0].className.toLowerCase(),
          top3[0].className.trim()
        ];
        let guide = "분리배출 기준을 다시 확인해주세요 (클래스명 매핑이 필요합니다).";
        for(const k of keyCandidates){
          if(GUIDE_DB[k] !== undefined){ guide = GUIDE_DB[k]; break; }
        }
        guideBox.innerHTML = `🗑️ <strong>배출 안내:</strong><br>${guide}`;

      }catch(err){
        topLabel.textContent = '예측 실패';
        guideBox.textContent = '이미지를 다시 선택해 주세요.';
        console.error(err);
      }finally{
        tf.engine().endScope();
      }
    }

    // 페이지 진입 시 모델 선로드(선택)
    // loadModel();
  </script>
</body>
</html>
